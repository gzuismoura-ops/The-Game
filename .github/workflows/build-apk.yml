name: Build Android APK

# Builds an installable APK from the web game using Capacitor.
# GitHub's ubuntu-latest runner ships with the Android SDK pre-installed, so
# nothing needs to be downloaded or configured beyond setting the env vars.
#
# Download the APK from the run's "Artifacts" section, or from Releases when you
# push a v* tag (this workflow attaches it automatically in that case).

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # The Android SDK is already installed on this image. Point the build at it
      # instead of installing it again (a third-party setup action was failing here).
      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK at $SDK"
          test -d "$SDK" || { echo "::error::Android SDK not found at $SDK"; ls -la /usr/local/lib/android 2>/dev/null; exit 1; }
          ls "$SDK" | head
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          # accept licenses for any SDK component Gradle may pull in
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Build the web game
        run: npm run build

      - name: Add the Android platform
        run: |
          npx cap add android
          npx cap sync android
          ls -la android/

      - name: Lock the activity to landscape
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          cat "$MANIFEST"
          sed -i 's/android:screenOrientation="[^"]*"//g' "$MANIFEST"
          sed -i 's|<activity|<activity android:screenOrientation="sensorLandscape"|' "$MANIFEST"
          echo "--- after ---"
          grep -n "activity" "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the artifact
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/yshmara-hollow-hymn.apk"
          ls -lh out/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yshmara-apk
          path: out/yshmara-hollow-hymn.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/yshmara-hollow-hymn.apk
          generate_release_notes: true
